# 模型注册表 — 多模型共指导协议
# weight 是决策权重（分权重机制核心）：投票/评审按权重加权，而非按人头。
# price_in/price_out 为估算单价（USD/百万 token），仅用于成本统计，可自行修改。

[models.gemini-pro]
name = "Gemini 2.5 Pro"
provider = "gemini"
model = "gemini-2.5-pro"
weight = 1.2
roles = ["councillor", "chairman"]
fallbacks = ["gemini-2.5-flash", "gemini-2.0-flash"]
price_in = 1.25
price_out = 10.0
use_search = true

[models.gemini-flash]
name = "Gemini 2.5 Flash"
provider = "gemini"
model = "gemini-2.5-flash"
weight = 1.0
roles = ["councillor"]
fallbacks = ["gemini-2.0-flash"]
price_in = 0.30
price_out = 2.50
use_search = true

# Antigravity CLI 桥接：2026-06-18 起 Google 停止用 Gemini CLI 服务
# 个人版/AI Pro/Ultra 账号，官方继任者是 Antigravity CLI（agy）。
# 用 AI Pro 订阅账号登录一次 `agy`，即可无 key、无绑卡直连订阅额度。
[models.gemini-cli]
name = "Gemini（Antigravity CLI·订阅）"
provider = "gemini-cli"
model = "auto"                  # auto = 用 agy 默认模型；登录后可用 `agy models` 查看并改
weight = 1.2
roles = ["councillor"]          # 参与者/辅助者，主持与主干活由 DeepSeek 承担
price_in = 1.25
price_out = 10.0

# 中转站示例（OpenAI 兼容端点，支持支付宝/微信充值的那种）：
# 1) 在 config/keys.local.json 写 {"relay": "sk-你的中转站key"}
# 2) 把下面注释复制一份，base_url 换成中转站地址，model 换成中转站提供的模型 id
# [models.relay-gemini]
# name = "Gemini Pro（中转站）"
# provider = "relay"
# base_url = "https://你的中转站域名/v1"
# model = "gemini-2.5-pro"
# weight = 1.2
# roles = ["councillor", "chairman"]

